[project]
name = "ballondor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "pandas>=2.2",
  "numpy>=2",
  "statsmodels>=0.14",
  "pyarrow>=17",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["."]
